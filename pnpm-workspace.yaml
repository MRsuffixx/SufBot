packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

injectWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@playwright/test@1.62.0'
  - bullmq@5.81.2
  - playwright-core@1.62.0
  - playwright@1.62.0
